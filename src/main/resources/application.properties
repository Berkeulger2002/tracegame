spring.application.name=trace-backend
server.port=8080

# MongoDB - Spring Boot 4
spring.mongodb.uri=mongodb://localhost:27018/trace_db

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6380
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=2s

# Oyun tarihlerini hesaplamak için kullanacağımız ayar
app.game.zone-id=Europe/Istanbul
# Yerel geliştirmede bugüne ait örnek oyun oluşturur.
app.seed.enabled=true
# Yerel HTTP bağlantısı için
app.auth.cookie-secure=false
app.auth.allowed-origins=http://localhost:8080,http://localhost:5173
logging.level.com.trace.backend.service.AdminGameStatsService=DEBUG